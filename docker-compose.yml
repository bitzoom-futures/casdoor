name: futures_auth

# Dokploy Compose 自动部署（在 119.12.165.87 面板创建，目标服务器选 121.91.175.132）
#
# 项目设置：
#   类型: Compose
#   仓库: bitzoom-futures/casdoor
#   分支: dokploy-deploy
#   Compose 文件: docker-compose.yml
#   服务器: 121.91.175.132（远程）
#   Auto Deploy: 开启
#
# Environment Variables（全部必填，在 Dokploy 面板填写）：
#   ENV=prod
#   DOMAIN=auth.riverwa.com
#   ORIGIN=https://auth.riverwa.com
#   STATIC_BASE_URL=https://auth1.riverwa.com
#   DB_NAME=auth
#   DB_USER=auth_user
#   DB_PASSWORD=bitZoom2025_auth
#   MYSQL_ROOT_PASSWORD=<自定义root密码>
#   DATA_SOURCE_NAME=auth_user:bitZoom2025_auth@tcp(mysql:3306)/
#   （DB 密码勿含 @，Go DSN 不会解码 %40）
#
# DNS：Cloudflare 将 auth.riverwa.com 源站设为 121.91.175.132

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-auth}
      MYSQL_USER: ${DB_USER:-auth_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=500
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  casdoor:
    build:
      context: .
      dockerfile: Dockerfile
      target: STANDARD
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      RUNNING_IN_DOCKER: "true"
      appname: futures_auth
      httpport: "8000"
      runmode: prod
      dbName: ${DB_NAME:-auth}
      authState: auth
      dataSourceName: ${DATA_SOURCE_NAME}
      # 默认已被代码忽略：静态资源前缀跟随页面请求的域名。
      # 仅当同时设置 staticBaseUrlMode=config 时下面的值才生效。
      staticBaseUrl: ${STATIC_BASE_URL:-https://auth1.riverwa.com}
      origin: ${ORIGIN:-https://auth.riverwa.com}
      initDataNewOnly: "true"
      logConfig: '{"adapter":"file", "filename": "logs/casdoor.log", "maxdays":10, "perm":"0770"}'
    volumes:
      - casdoor-logs:/logs
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.futures-auth-${ENV:-prod}.rule=Host(`${DOMAIN:-auth.riverwa.com}`)
      - traefik.http.routers.futures-auth-${ENV:-prod}.entrypoints=websecure
      - traefik.http.routers.futures-auth-${ENV:-prod}.tls=true
      - traefik.http.routers.futures-auth-${ENV:-prod}.tls.certresolver=letsencrypt
      - traefik.http.services.futures-auth-${ENV:-prod}.loadbalancer.server.port=8000
      - traefik.http.middlewares.futures-auth-${ENV:-prod}-redirect.redirectscheme.scheme=https
      - traefik.http.routers.futures-auth-${ENV:-prod}-http.rule=Host(`${DOMAIN:-auth.riverwa.com}`)
      - traefik.http.routers.futures-auth-${ENV:-prod}-http.entrypoints=web
      - traefik.http.routers.futures-auth-${ENV:-prod}-http.middlewares=futures-auth-${ENV:-prod}-redirect
    networks:
      - dokploy-network
      - default

volumes:
  mysql-data:
  casdoor-logs:

networks:
  dokploy-network:
    external: true